name: Build WASM

on:
  workflow_call:
    inputs:
      release:
        description: Build in release mode (LTO + wasm-opt)
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: Name of the uploaded dist artifact
        value: occt-wasm-dist

jobs:
  build:
    name: WASM Build & Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andymai/occt-wasm-builder:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Link pre-built OCCT libs
        run: |
          cp -r /workspace/occt/build occt/build
          cp -r /workspace/3rdparty 3rdparty

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          cd ts && npm ci

      - name: Build facade + link WASM
        run: cargo xtask build ${{ inputs.release && '--release' || '' }}

      - name: Build TypeScript
        run: |
          cd ts
          npm run build
          cp ../dist/occt-wasm.js ../dist/occt-wasm.wasm dist/

      - name: Run tests
        run: npx vitest run

      # The demos are the documentation people actually copy from, and they
      # used to fail silently — a try/catch rendered an unfilleted shape and
      # nothing complained. Non-zero exit is the gate.
      - name: Run node examples
        shell: bash
        run: |
          for example in examples/node-cli/*.mjs; do
            echo "::group::$example"
            node "$example"
            echo "::endgroup::"
          done

      - name: Run benchmarks & check for regressions
        if: ${{ !inputs.release }}
        shell: bash
        run: |
          npx vitest run test/bench.test.ts
          node scripts/bench-check.js

      # Refreshing benchmarks/baseline.json requires numbers measured on runner
      # hardware, so the results have to leave the runner. Uploaded even when the
      # gate fails, since that is exactly when the numbers are worth reading.
      - name: Upload benchmark results
        if: ${{ !cancelled() && !inputs.release }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmarks/last-run.json
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: occt-wasm-dist
          path: ts/dist/
          retention-days: 7
